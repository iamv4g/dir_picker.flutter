name: dir_picker
description: "A Flutter plugin for picking directories and listing file system entries, supporting Android, iOS, macOS, Windows, Linux, and Web via FFI and JNI."
version: 0.5.0
homepage: https://github.com/vanvixi/dir_picker.flutter
repository: https://github.com/vanvixi/dir_picker.flutter
issue_tracker: https://github.com/vanvixi/dir_picker.flutter/issues
topics:
  - dir-picker
  - directory
  - picker
  - ffi
  - jni

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ffi: ^2.2.0
  jni: ^1.0.0
  dbus: ^0.7.12
  path: ^1.9.1
  web: ^1.1.1

dev_dependencies:
  ffigen: ^20.1.1
  jnigen: ^0.16.0

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  plugin:
    platforms:
      android:
        package: com.vanvixi.dir_picker
        pluginClass: DirPickerPlugin
        dartPluginClass: DirPickerAndroid
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
        dartPluginClass: DirPickerDarwin
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
        dartPluginClass: DirPickerDarwin
      windows:
        dartPluginClass: DirPickerWindows
      linux:
        dartPluginClass: DirPickerLinux
      web:
        pluginClass: DirPickerWeb
        fileName: dir_picker.dart

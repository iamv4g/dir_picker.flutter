name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PRs only. Every commit on main gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull requests only run the platform jobs their changes need (see
  # tool/ci_changes.sh). Pushes to main run everything. Analyze & test and
  # the pub.dev score always run.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.scope.outputs.android }}
      darwin: ${{ steps.scope.outputs.darwin }}
      windows: ${{ steps.scope.outputs.windows }}
      linux: ${{ steps.scope.outputs.linux }}
      web: ${{ steps.scope.outputs.web }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE...$HEAD" | tee /dev/stderr | bash tool/ci_changes.sh
          else
            bash tool/ci_changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"

  analyze-test:
    name: Analyze & test (Flutter ${{ matrix.flutter-version || 'stable' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported Flutter (pubspec environment) and latest stable.
        flutter-version: ['3.44.0', '']
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - run: flutter pub get
      # The formatter's output differs between SDK versions, so only check it
      # on latest stable, which is what pub.dev scores against.
      - name: Check formatting
        if: matrix.flutter-version == ''
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # Web runs compile all given files into one bundle, so they only get
      # the folders that build for the browser (test/io needs dart:io).
      - name: Test on Chrome (JS and Wasm)
        if: matrix.flutter-version == ''
        run: |
          flutter test --platform chrome test/common test/web
          flutter test --platform chrome --wasm test/common test/web
      - name: Publish dry run
        if: matrix.flutter-version == ''
        run: flutter pub publish --dry-run

  pana:
    name: pub.dev score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate pana
      # Fails if any pub point is lost. A new major release of a dependency
      # also costs points, so this job can fail without a code change.
      - run: dart pub global run pana --no-warning --exit-code-threshold 0 .

  build-web:
    name: Build example (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web
      - run: flutter build web --wasm

  build-android:
    name: Build example (Android)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # A release build, so R8 shrinks and renames the plugin with its consumer
      # rules, as it does in apps that use it.
      - run: flutter build apk --release
      - name: Check R8 kept every JNI lookup
        working-directory: .
        run: |
          flutter pub get
          dart run tool/check_jni_keeps.dart example/build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Build example (Linux)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build linux --debug

  build-darwin:
    name: Build example (iOS & macOS)
    needs: changes
    if: needs.changes.outputs.darwin == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign
      - run: flutter build macos --debug

  build-windows:
    name: Test & build example (Windows)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Runs the Windows-only tests in test/io/windows_test.dart.
      - name: Test
        working-directory: .
        run: flutter test
      - run: flutter build windows --debug

  # Runs example/integration_test in the example app, so listEntries goes
  # through the registered plugin and its native bridge. Android is left out:
  # its listEntries only takes SAF tree URIs, which need the system picker.
  # iOS is left out too: on the hosted runners, flutter test launches the app
  # on the simulator but never finds its VM service, and waits until timeout.
  # macOS runs the same shared Swift listEntries, so run iOS locally with
  # `flutter test integration_test -d <simulator id>` when the Swift changes.
  integration-test:
    name: Integration test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # A test that cannot reach the app otherwise waits until the 6 hour limit.
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.integration != '[]'
    strategy:
      fail-fast: false
      matrix:
        # The targets whose native code the change touches, e.g.
        # [{"target": "macOS", "os": "macos-latest"}].
        include: ${{ fromJSON(needs.changes.outputs.integration) }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: matrix.target == 'macOS'
        run: flutter test integration_test -d macos
      - if: matrix.target == 'Linux'
        run: xvfb-run -a flutter test integration_test -d linux
      - if: matrix.target == 'Windows'
        run: flutter test integration_test -d windows

  # The only check the main branch ruleset requires. Skipped jobs don't fail
  # it, so a pull request isn't blocked waiting for jobs it didn't need.
  result:
    name: CI result
    if: always()
    needs:
      - changes
      - analyze-test
      - pana
      - build-web
      - build-android
      - build-linux
      - build-darwin
      - build-windows
      - integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
